<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epicycle</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --accent:#3b5bdb;
          --pass:#2f9e44; --changes:#e8590c; --fail:#c92a2a; --wait:#f08c00; --chip:#f1f1ee; --needs:#d6336c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#1f1f1d; --ink:#ecece8; --muted:#9a9a93; --line:#33332f; --chip:#2a2a27; }
  }
  #offline { position:sticky; top:0; z-index:50; background:var(--fail); color:#fff; padding:8px 20px; font-weight:500; }
  .steps { display:flex; gap:3px; margin-top:6px; }
  .steps i { width:10px; height:10px; border-radius:2px; border:1px solid var(--line); }
  .steps i.pass { background:var(--pass); border-color:var(--pass); } .steps i.changes { background:var(--changes); border-color:var(--changes); }
  .steps i.running { background:var(--wait); border-color:var(--wait); animation:pulse 1.6s ease-in-out infinite; }
  .steps i.skipped { opacity:.35; border-style:dashed; }
  @keyframes pulse { 50% { opacity:.45; } }
  #feed { margin-bottom:10px; font-size:12px; }
  #feed summary { cursor:pointer; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  #feed-list { max-height:150px; overflow:auto; }
  #feed a { display:flex; gap:8px; padding:2px 0; cursor:pointer; } #feed a:hover { text-decoration:underline; }
  #feed a span { color:var(--muted); white-space:nowrap; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:24px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  nav button { background:none; border:0; padding:6px 10px; color:var(--muted); font:inherit; cursor:pointer; border-radius:6px; }
  nav button.on { color:var(--ink); background:var(--chip); }
  .meter { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-left:auto; }
  .bar { width:140px; height:6px; background:var(--chip); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar i.warn { background:var(--wait); } .bar i.over { background:var(--fail); }
  main { padding:16px 20px; }
  .muted { color:var(--muted); }
  .small { font-size:12px; }
  /* needs-you strip */
  .strip { border:1px solid var(--needs); border-radius:8px; padding:8px 12px; margin-bottom:12px; background:rgba(214,51,108,.06); }
  .strip h2 { margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--needs); display:flex; align-items:center; gap:6px; }
  .strip a { display:flex; gap:8px; align-items:center; padding:3px 0; cursor:pointer; }
  .strip a:hover { text-decoration:underline; }
  .ico { display:inline-flex; vertical-align:middle; color:var(--needs); }
  .ico svg { width:15px; height:15px; }
  /* board */
  .board { display:grid; gap:10px; }
  .col { background:var(--chip); border-radius:10px; padding:8px; align-self:start; min-height:44px; }
  .col.empty { padding:6px 8px; opacity:.75; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:2px 4px 8px; font-weight:600; }
  .col.empty h2 { margin-bottom:2px; }
  .col .count { font-weight:400; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .card:hover { border-color:var(--accent); }
  .card.needs { border:2px solid var(--needs); padding:9px; }
  .card.bl { border-left:3px solid var(--line); }
  .card.bl.high { border-left-color:var(--fail); } .card.bl.medium { border-left-color:var(--wait); } .card.bl.low { border-left-color:var(--pass); }
  .card .d { color:var(--muted); font-size:12px; margin-top:4px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .t { font-weight:500; margin:2px 0 4px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .id { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
  .card .status { font-size:12px; color:var(--muted); }
  .card.needs .status { color:var(--needs); font-weight:500; }
  .stale { color:var(--wait); font-weight:500; }
  .tok { height:4px; background:var(--chip); border-radius:2px; overflow:hidden; margin-top:6px; }
  .tok i { display:block; height:100%; background:var(--accent); }
  .tok i.warn { background:var(--wait); } .tok i.over { background:var(--fail); }
  .addcard, .more { width:100%; text-align:left; background:none; border:0; color:var(--muted); padding:6px 4px; font:inherit; cursor:pointer; border-radius:6px; }
  .addcard:hover, .more:hover { background:var(--line); color:var(--ink); }
  /* buttons, forms */
  button.primary { background:var(--accent); color:#fff; border:0; padding:7px 14px; border-radius:6px; font:inherit; cursor:pointer; }
  button.secondary { background:var(--chip); color:var(--ink); border:0; padding:7px 14px; border-radius:6px; font:inherit; cursor:pointer; }
  button.danger { background:none; color:var(--fail); border:0; padding:7px 10px; font:inherit; cursor:pointer; }
  button.small { padding:3px 10px; font-size:12px; }
  .form label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  .form input, .form textarea, .form select, textarea.note { width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .form textarea { min-height:160px; resize:vertical; }
  textarea.note { min-height:70px; margin:8px 0; }
  .actions { position:sticky; bottom:0; background:var(--bg); padding:12px 0; display:flex; gap:8px; align-items:center; }
  .form .actions { position:static; background:none; }
  .err { color:var(--fail); font-size:12px; }
  /* chips */
  .chip { font-size:11px; padding:1px 7px; border-radius:10px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .chip.pass { color:#fff; background:var(--pass); } .chip.changes { color:#fff; background:var(--changes); }
  .chip.needs { color:#fff; background:var(--needs); } .chip.open { color:#fff; background:var(--accent); }
  .chip.tag { background:rgba(214,51,108,.12); color:var(--needs); }
  /* drawer */
  #drawer { position:fixed; top:0; right:0; width:min(720px, 100%); height:100%; background:var(--panel); border-left:1px solid var(--line);
            box-shadow:-8px 0 24px rgba(0,0,0,.08); transform:translateX(100%); transition:transform .15s; overflow:auto; padding:20px; }
  #drawer.open { transform:none; }
  #drawer .close { float:right; cursor:pointer; border:0; background:none; font-size:20px; color:var(--muted); }
  #drawer h2.title { font-size:18px; font-weight:600; margin:0 0 4px; }
  #drawer h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:20px 0 8px; font-weight:600; }
  .status-line { color:var(--muted); }
  .status-line.needs { color:var(--needs); font-weight:500; }
  .decision { border:2px solid var(--needs); border-radius:8px; padding:12px 14px; margin:14px 0; }
  #drawer .decision h3 { margin:0 0 6px; color:var(--needs); }
  .decision .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .decision .done { color:var(--pass); }
  details.row { border-top:1px solid var(--line); }
  details.row > summary { cursor:pointer; padding:6px 0; list-style:none; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  details.row > summary::-webkit-details-marker { display:none; }
  details.row > summary::before { content:"▸"; color:var(--muted); font-size:11px; width:10px; }
  details.row[open] > summary::before { content:"▾"; }
  details.row > .in { padding:0 0 8px 18px; }
  details.row details.row { border-top:0; }
  .ok { color:var(--pass); } .run { color:var(--accent); } .todo { color:var(--muted); }
  .line { margin:3px 0; font-size:13px; } .line b { font-weight:600; }
  .line.pushback b { color:var(--changes); } .line.dir { color:var(--muted); }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; font-size:13px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-word; }
  pre.md { white-space:pre-wrap; background:var(--chip); padding:12px; border-radius:6px; font:12px/1.5 ui-monospace, Menlo, monospace; max-height:420px; overflow:auto; }
  .diag { font-size:12px; color:var(--muted); margin:4px 0; }
  .alert { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border-radius:6px; background:var(--chip); margin:4px 0; font-size:13px; }
  .alert .x { margin-left:auto; cursor:pointer; color:var(--muted); background:none; border:0; font:inherit; }
  .md { font-size:14px; line-height:1.55; }
  .md h1 { font-size:20px; margin:0 0 10px; } .md h2 { font-size:16px; margin:22px 0 8px; } .md h3 { font-size:14px; margin:16px 0 6px; }
  .md code { background:rgba(127,127,127,.15); padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .md pre { background:rgba(127,127,127,.12); padding:10px 12px; border-radius:6px; overflow:auto; } .md pre code { background:none; padding:0; }
  .md table { border-collapse:collapse; margin:10px 0; font-size:13px; } .md th, .md td { border:1px solid rgba(127,127,127,.3); padding:5px 9px; text-align:left; vertical-align:top; }
  .md th { background:rgba(127,127,127,.12); } .md ul, .md ol { padding-left:22px; margin:6px 0; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .rv-err { color:#e5484d; } .rv-file { font-family:ui-monospace,Menlo,monospace; font-size:12px; } .rv-errtext { color:#e5484d; margin-left:6px; }
  .rv-act { white-space:nowrap; }
  .rv-act a, .entry .ia { margin-left:6px; color:var(--muted); cursor:pointer; display:inline-flex; vertical-align:middle; }
  .rv-act a:first-child { margin-left:0; }
  .rv-act a:hover, .entry .ia:hover { color:var(--accent); }
  .ia.del:hover, .rv-act a.del:hover { color:#e5484d !important; }
  .entry { display:flex; gap:8px; align-items:flex-start; padding:4px 0; font-size:13px; }
  .entry code { color:var(--muted); }
  .entry textarea, .entry input { font:inherit; font-size:13px; }
  /* settings */
  .group { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .group h3 { margin:0 0 10px; font-size:14px; }
  .field { display:grid; grid-template-columns:240px 1fr; gap:10px; padding:6px 0; align-items:start; }
  .field > label { font-size:13px; padding-top:6px; }
  .field .help { color:var(--muted); font-size:12px; margin-top:3px; }
  .field input[type=number] { width:160px; }
  .field input, .field select, .field textarea { width:100%; font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .field.changed input, .field.changed select, .field.changed textarea { border-color:var(--accent); }
  .field .unit { color:var(--muted); font-size:12px; margin-left:6px; }
  .ov { font-size:10px; color:var(--accent); margin-left:6px; }
  .subtabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .subtabs button { background:none; border:0; border-bottom:2px solid transparent; padding:7px 12px; color:var(--muted); font:inherit; cursor:pointer; }
  .subtabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
  .subtabs button.dirty::after { content:" \2022"; color:var(--accent); }
  .diff { font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; background:var(--chip); padding:10px; border-radius:6px; }
  .diff .add { color:var(--pass); } .diff .del { color:var(--fail); }
  /* workflow tab */
  .flow { display:flex; gap:12px; align-items:flex-start; overflow-x:auto; padding-bottom:12px; }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:250px; flex:1 0 250px; }
  .stage > h3 { margin:0 0 2px; font-size:15px; }
  .stage .sets { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; font-size:12px; color:var(--muted); }
  .stage .sets label { display:flex; align-items:center; gap:4px; }
  .stage .sets input { width:84px; font:inherit; padding:2px 5px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--ink); }
  .stage .sets input.changed { border-color:var(--accent); }
  .phase { margin-top:10px; }
  .row > .in > h4 { margin:8px 0 2px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  .phase h4 { margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .wstep { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; }
  .wstep:hover { background:var(--chip); }
  .wstep.off .name { color:var(--muted); text-decoration:line-through; }
  .wstep .name { flex:1; }
  .wstep .name.link { cursor:pointer; } .wstep .name.link:hover { color:var(--accent); }
  .wstep .kind { font-size:11px; color:var(--muted); }
  .sw { position:relative; width:30px; height:17px; flex:none; }
  .sw input { opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; }
  .sw span { position:absolute; inset:0; background:var(--line); border-radius:9px; transition:background .1s; pointer-events:none; }
  .sw span::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .1s; }
  .sw input:checked + span { background:var(--pass); } .sw input:checked + span::after { left:15px; }
  .wstep .ia { color:var(--muted); cursor:pointer; display:inline-flex; }
  .wstep .ia:hover { color:var(--accent); } .wstep .ia.del:hover { color:#e5484d; }
  .wstep .tools { display:flex; gap:4px; opacity:.55; min-width:56px; justify-content:flex-end; } .wstep:hover .tools { opacity:1; }
  .banner { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:12px; background:var(--chip); border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .banner > span { flex:1; }
  .addstep { margin-top:8px; }
  .addform { margin-top:6px; padding:8px; background:var(--chip); border-radius:6px; display:grid; gap:6px; }
  .addform input, .addform select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--ink); width:100%; }
  .rules { width:100%; font:12px/1.5 ui-monospace, Menlo, monospace; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); box-sizing:border-box; }
  @media (max-width: 700px) { .field { grid-template-columns:1fr; } main { padding:12px; } }
</style>
</head>
<body>
<div id="offline" hidden></div>
<header>
  <h1 id="repo">Epicycle</h1>
  <nav><button id="tab-board" class="on">Board</button><button id="tab-settings">Settings</button><button id="tab-help">Help</button></nav>
  <div class="meter"><span id="month-label">Month</span><div class="bar"><i id="month-bar"></i></div></div>
</header>
<main id="board-view">
  <div id="strip"></div>
  <div class="muted small" id="trends" style="margin-bottom:10px"></div>
  <details id="feed" hidden><summary>Activity</summary><div id="feed-list"></div></details>
  <div class="board" id="board"></div>
</main>
<main id="settings-view" class="settings" hidden></main>
<main id="help-view" hidden><div id="help-text" class="md"></div></main>
<aside id="drawer"><button class="close" onclick="closeDrawer()">×</button><div id="drawer-body"></div></aside>
<script>

const TOKEN = new URLSearchParams(location.search).get("token");
const H = {"X-Epi-Token": TOKEN, "Content-Type": "application/json"};
const api = (p, opts={}) => fetch(p, {...opts, headers: H}).then(async r => {
  const t = r.headers.get("Content-Type") || ""; const body = t.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw Object.assign(new Error(body.error || r.statusText), {status: r.status}); return body; });
const post = (p, body) => api(p, {method: "POST", body: JSON.stringify(body)});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/, "")+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n||0);
const dur = s => s == null ? "" : s < 90 ? s+"s" : s < 5400 ? Math.round(s/60)+"m" : (s/3600).toFixed(1)+"h";
const ALERT_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1z" fill="currentColor"/><path d="M8 6v4M8 11.6v.9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';
const alertIcon = `<span class="ico" title="Needs you">${ALERT_ICON}</span>`;
const EDIT_ICON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L5.5 13H3v-2.5z"/></svg>';
const DEL_ICON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 8.5h6.6l.7-8.5"/></svg>';
let LABELS = {};

function meter(el, used, limit) {
  const f = limit ? used/limit : 0; el.style.width = Math.min(100, f*100)+"%";
  el.className = f >= 1 ? "over" : f >= .8 ? "warn" : "";
}

/* ---------------- Board ---------------- */
let BACKLOG = [], SHOW_ALL_DONE = false;
const DONE_SHOWN = 4;
function blCard(x) {
  return `<div class="card bl ${esc(x.priority)}" onclick="openBacklog('${esc(x.id)}')">
    <div class="id">${/^\d+$/.test(x.id) ? "task-" : ""}${esc(x.id)}${x.priority ? " · " + esc(x.priority) : ""}</div>
    <div class="t">${esc(x.title)}</div>
    ${x.description ? `<div class="d">${esc(x.description)}</div>` : ""}</div>`;
}
function openBacklog(id) {
  const x = BACKLOG.find(i => i.id === id) || {title:"", description:"", priority:"", created:""};
  const opt = v => `<option value="${v}" ${x.priority===v?"selected":""}>${v||"none"}</option>`;
  document.getElementById("drawer-body").innerHTML = `<div class="form">
    <h2 class="title">${id ? (/^\d+$/.test(id) ? "task-" : "Backlog item ") + esc(id) : "New backlog item"}</h2>
    ${x.created ? `<div class="muted">Added ${esc(new Date(x.created).toLocaleString())} · not started. Run <code>/epi:start ${esc(id)}</code> to begin.</div>` : ""}
    <label>Title</label><input id="bl-title" value="${esc(x.title)}">
    <label>Description</label><textarea id="bl-desc" placeholder="What should be built? Acceptance criteria, links, constraints...">${esc(x.description)}</textarea>
    <label>Priority</label><select id="bl-pri">${["","low","medium","high"].map(opt).join("")}</select>
    <div class="actions"><button class="primary" onclick="saveBacklog('${esc(id||"")}')">Save</button>
      <button class="secondary" onclick="closeDrawer()">Cancel</button>
      ${id ? `<button class="danger" style="margin-left:auto" onclick="delBacklog('${esc(id)}')">Delete</button>` : ""}</div>
    <div class="err" id="bl-err"></div></div>`;
  document.getElementById("drawer").classList.add("open");
}
async function postBacklog(body) {
  try { await post("/api/backlog", body); closeDrawer(); loadBoard(); }
  catch (e) { document.getElementById("bl-err").textContent = e.message; }
}
const saveBacklog = id => postBacklog({action: id ? "update" : "add", id,
  title: document.getElementById("bl-title").value, description: document.getElementById("bl-desc").value,
  priority: document.getElementById("bl-pri").value});
const delBacklog = id => confirm("Delete this backlog item?") && postBacklog({action:"delete", id});

function cardHtml(j) {
  const r = j.budget ? j.tokens/j.budget : 0, f = Math.min(100, r*100), level = r >= 1 ? "over" : r >= WARN_AT ? "warn" : "";
  const round = j.round > 1 && !["done", "cancelled", "queued"].includes(j.status) ? ` · round ${j.round}` : "";
  return `<div class="card${j.needs_you ? " needs" : ""}" onclick="openTask('${esc(j.id)}')">
    <div class="id">task-${esc(j.id)}${round}${j.needs_you ? alertIcon : ""}</div>
    <div class="t">${esc(j.title)}</div>
    ${stepsHtml(j.strip)}
    <div class="status">${esc(j.text)}${j.stalled ? ` · <span class="stale">no activity for ${j.quiet_minutes} min</span>` : ""}</div>
    <div class="tok" title="${fmt(j.tokens)} of ${fmt(j.budget)} tokens"><i class="${level}" style="width:${f}%"></i></div></div>`;
}
function stepsHtml(strip) {
  return strip && strip.length ? `<div class="steps">${strip.map(s => `<i class="${s.state}" title="${esc(s.label)}: ${s.state === "skipped" ? "left out" : s.state === "todo" ? "waiting" : s.state}"></i>`).join("")}</div>` : "";
}

}
function fieldHtml(f) {
  return `<div class="field${f.path in changes ? " changed" : ""}" id="row-${f.path}"><label for="f-${f.path}">${esc(f.label)}${isSet(S.overrides, f.path) ? '<span class="ov">changed</span>' : ""}</label>
    <div>${inputFor(f)}<div class="help">${esc(f.help)}${f.usage === "month" ? " · used this month: "+fmt(S.usage.month) : ""}${f.additive ? " · built in: "+esc((get(S.defaults, f.path)||[]).join(", ")) : ""}</div><div class="err" id="err-${f.path}"></div></div></div>`;
}
function parseField(el) {
  const t = el.dataset.type, v = el.value.trim();
  if (t === "int") return v === "" ? null : parseInt(v, 10);
  if (t === "float") return v === "" ? null : parseFloat(v);
  if (t === "list") return v ? v.split("\n").map(x => x.trim()).filter(Boolean) : null;
  if (t === "bool") return v === "true";
  if (t === "enum" && el.dataset.vt === "int") return v === "" ? null : parseInt(v, 10);
  return v === "" ? null : v;
}
function markDirty(path) {
  const b = document.getElementById("st-" + tabOfPath(path)); if (b) b.classList.add("dirty");
}
function onField(el) {
  const p = el.dataset.path, v = parseField(el); changes[p] = v;
  const row = document.getElementById("row-" + p); if (row) row.classList.add("changed"); else el.classList.add("changed");
  const u = document.getElementById("unit-" + p); if (u) u.textContent = v ? fmt(v) + " tokens" : "";
  const err = document.getElementById("err-" + p); if (err) err.textContent = "";
  markDirty(p);
}
const wire = root => root.querySelectorAll("[data-path]").forEach(el => el.addEventListener("input", () => onField(el)));

/* ---- Global ---- */
function globalHtml() {
  const tab = schemaTab("global");
  const section = sec => {
    if (sec.collection === "principles") return ADV ? `<div class="group"><h3>${esc(sec.title)} <button class="secondary small" id="pp-add" style="float:right" onclick="ppEdit(null)">+ Add principle</button></h3>
      <div class="muted small" style="margin:-4px 0 8px">How this repo does things. Agents are pointed at the ones that apply to them and read what is relevant. Files with no text yet are not shown to agents.</div>
      <div id="pp-list"></div><div class="err" id="err-principles"></div></div>` : "";
    const fs = (sec.fields || []).filter(f => ADV || f.level === "basic");
    const extra = sec.open ? `<div class="muted small">You can add more by editing .claude/epi.md.</div>` : "";
    return fs.length ? `<div class="group"><h3>${esc(sec.title)}</h3>${fs.map(fieldHtml).join("")}${ADV ? extra : ""}</div>` : "";
  };
  return tab.sections.map(section).join("") +
    `<button class="secondary" onclick="ADV=!ADV;renderSettings()">${ADV ? "Hide advanced settings" : "Show advanced settings"}</button>`;
}

/* ---- Workflow: stages left to right, each with its steps by phase ---- */
const stageOf = sid => S.workflow.stages.find(s => s.id === sid);
/* the phases as people see them: the sign-off is the start of Finish. Steps are edited in workflow.yaml; `on` is its `enabled`. */
const SHOWN = ["plan", "do", "verify", "review", "finalize", "finish"];
function stepsOf(st) {
  const phases = {}, tag = (ph, xs) => xs.map(x => ({...x, ph}));
  for (const ph of S.workflow.lists) phases[ph] = [...(ph === "finish" ? tag("signoff", st.phases.signoff) : []), ...tag(ph, st.phases[ph])];
  return phases;
}
const UP_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10l4.5-4.5 4.5 4.5"/></svg>';
const DOWN_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>';
const opAttr = op => esc(JSON.stringify(op));
function stepRowHtml(st, ph, x, i, n) {
  const link = x.settings && ["agent", "skill"].includes(x.kind), at = {stage: st.id, phase: x.ph, id: x.id};
  const tool = (title, icon, op, cls = "") => `<a class="ia ${cls}" title="${title}" onclick="wop(${opAttr({...at, ...op})})">${icon}</a>`;
  const tools = x.ph === "signoff" ? "" : `<span class="tools">${i > 0 ? tool("Move up", UP_ICON, {op: "move", by: -1}) : ""}${i < n - 1 ? tool("Move down", DOWN_ICON, {op: "move", by: 1}) : ""}${tool("Remove", DEL_ICON, {op: "remove"}, "del")}</span>`;
  return `<div class="wstep${x.on ? "" : " off"}">
    <label class="sw" title="${x.on ? "On" : "Off"}"><input type="checkbox" ${x.on ? "checked" : ""} onchange="wtoggle(${opAttr(at)}, this.checked)"><span></span></label>
    <span class="name${link ? " link" : ""}" ${link ? `onclick="openStepSettings('${esc(st.id)}','${esc(x.name)}','${esc(x.kind)}')" title="Settings"` : ""}>${esc(x.label)}</span>
    ${x.if ? `<span class="kind" title="Runs only when: ${esc(x.if)}">if</span>` : ""}
    <span class="kind">${esc(x.kind === "run" ? "command" : x.kind === "human" ? "person" : x.kind)}</span>${tools}</div>`;
}
function stageHtml(st) {
  const phases = stepsOf(st), ctx = {stage: st};
  const fs = stageFields(st.id).filter(f => appliesTo(f, ctx));
  const head = fs.filter(f => ["rounds", "budget_tokens"].includes(f.path.split(".")[2]));
  const rest = fs.filter(f => !head.includes(f));
  const small = f => `<label title="${esc(f.help)}">${esc(f.label)} <input type="number" id="f-${f.path}" data-path="${f.path}" data-type="${f.type}" value="${esc(curVal(f.path) ?? "")}" ${f.min != null ? `min="${f.min}"` : ""} ${f.max != null ? `max="${f.max}"` : ""} class="${f.path in changes ? "changed" : ""}">${f.unit === "tokens" ? `<span class="unit" id="unit-${f.path}">${curVal(f.path) ? fmt(curVal(f.path)) : ""}</span>` : ""}</label>`;
  const rows = ph => phases[ph].length ? `<div class="phase"><h4>${esc(S.workflow.phase_labels[ph])}</h4>${phases[ph].map(x => stepRowHtml(st, ph, x, phases[ph].filter(y => y.ph === ph).indexOf(x), phases[ph].filter(y => y.ph === ph).length)).join("")}</div>` : "";
  return `<div class="stage"><h3>${esc(st.name)}</h3>
    <div class="sets">${head.map(small).join("")}</div>
    ${rest.length ? `<details class="row"><summary class="small muted">More settings</summary><div class="in">${rest.map(fieldHtml).join("")}</div></details>` : ""}
    ${SHOWN.map(rows).join("")}${addFormHtml(st)}</div>`;
}
function addFormHtml(st) {
  if (ADDING !== st.id) return `<button class="more small addstep" onclick="ADDING='${esc(st.id)}';renderSettings()">+ Add step</button>`;
  const cmds = S.workflow.commands.map(c => `<option>${esc(c)}</option>`).join("");
  return `<div class="addform"><select id="add-phase">${S.workflow.lists.map(ph => `<option value="${ph}"${ph === "review" ? " selected" : ""}>${esc(S.workflow.phase_labels[ph])}</option>`).join("")}</select>
    <select id="add-kind" onchange="document.getElementById('add-name').setAttribute('list', this.value === 'run' ? 'add-cmds' : '')"><option value="agent">Agent</option><option value="skill">Skill</option><option value="run">Command</option></select>
    <input id="add-name" placeholder="Name, e.g. a11y or typecheck"><datalist id="add-cmds">${cmds}</datalist>
    <input id="add-if" placeholder="Only when (optional), e.g. touches-ui">
    <input id="add-id" placeholder="Id (optional)"><input id="add-outputs" placeholder="Outputs (optional), e.g. blocking, files">
    <textarea id="add-env" rows="2" placeholder="Environment of a command, one NAME=value per line (optional)"></textarea>
    <div class="err" id="add-err">${esc(ADDING === st.id ? WMSG : "")}</div>
    <div><button class="primary small" onclick="addStep('${esc(st.id)}')">Add</button> <button class="secondary small" onclick="ADDING=null;WMSG='';renderSettings()">Cancel</button></div></div>`;
}
const diffHtml = d => `<div class="diff">${esc(d).split("\n").map(l => /^\+(?!\+\+)/.test(l) ? `<span class="add">${l}</span>` : /^-(?!--)/.test(l) ? `<span class="del">${l}</span>` : l).join("\n")}</div>`;
function packHtml() {
  if (!PACK || !PACK.newer) return "";
  const files = (PACK.files || []).filter(f => !["same", "keep"].includes(f.action)), conf = PACK.conflicts || [];
  const review = !REVIEW ? "" : `<div class="group">${conf.length ? `<div class="err">Conflicts, nothing was written: ${[...new Set(conf.map(c => c.file))].map(esc).join(", ")}${conf.filter(c => c.field !== undefined).map(c => `<div>${esc(c.text)}</div>`).join("")}</div>` : ""}
    ${files.map(f => `<div style="margin-bottom:8px"><b>${esc(f.file)}</b> <span class="muted">${esc(f.action)}</span>${(PACK.diffs || {})[f.file] ? diffHtml(PACK.diffs[f.file]) : ""}</div>`).join("") || '<span class="muted">No file changes</span>'}</div>`;
  return `<div class="banner"><span>${esc(PACK.pack)} ${esc(PACK.installed)} → ${esc(PACK.available)} available</span>
    <button class="secondary small" onclick="REVIEW=!REVIEW;renderSettings()">Review</button>
    <button class="primary small" onclick="packUpgrade()">Upgrade</button></div>${review}`;
}
function pendingHtml() {
  if (!WDIFF && !WMSG) return "";
  return `<div class="group">${WMSG && ADDING === null ? `<div class="err">${esc(WMSG)}</div>` : ""}${WDIFF ? `<h3>Changes to workflow.yaml</h3>${diffHtml(WDIFF)}
    <div class="actions"><button class="primary" onclick="wsave()">Save</button><button class="secondary" onclick="wdiscard()">Discard</button></div>` : ""}</div>`;
}
function rulesHtml() {
  return `<div class="group" style="margin-top:12px"><h3>Rules</h3>
    <textarea class="rules" id="rules" rows="10" spellcheck="false" oninput="RULES=this.value;RDIFF=null">${esc(RULES ?? S.rules)}</textarea>
    <div class="actions"><button class="secondary small" onclick="rulesPreview()">Review rules</button><span class="err">${esc(RDIFF && RDIFF.error || "")}</span></div>
    ${RDIFF && RDIFF.diff != null ? (RDIFF.diff ? `<h3>Changes to ${esc(RDIFF.path)}</h3>${diffHtml(RDIFF.diff)}
      <div class="actions"><button class="primary" onclick="rulesSave()">Save</button><button class="secondary" onclick="RULES=null;RDIFF=null;renderSettings()">Discard</button></div>` : '<span class="muted">No changes</span>') : ""}</div>`;
}
function workflowHtml() {
  return `${packHtml()}${pendingHtml()}<div class="muted small" style="margin-bottom:10px">Workflow: ${esc(S.workflow.name)}. Click an agent or skill to change how it works.</div>
    <div class="flow">${S.workflow.stages.map(stageHtml).join("")}</div>${rulesHtml()}`;
}
async function wop(op) {
  try { const r = await post("/api/workflow/preview", {ops: [...WOPS, op]}); WOPS.push(op); WDIFF = r.diff; WMSG = ""; ADDING = null; }
  catch (e) { WMSG = e.message; }
  renderSettings();
}
const wtoggle = (at, on) => wop({...at, op: "toggle", enabled: on});
function addStep(sid) {
  const v = id => document.getElementById(id).value.trim(), name = v("add-name"), kind = v("add-kind"), rule = v("add-if"), err = document.getElementById("add-err");
  if (!/^[\w.-]+$/.test(name)) return err.textContent = "Give the name of an agent, skill or command";
  const outputs = v("add-outputs").split(/[\s,]+/).filter(Boolean);
  const env = Object.fromEntries(v("add-env").split("\n").map(l => l.trim()).filter(Boolean).map(l => [l.split("=")[0].trim(), l.slice(l.indexOf("=") + 1).trim()]));
  wop({op: "add", stage: sid, phase: v("add-phase"), kind, name, if: rule, id: v("add-id"), outputs, env});
}
function wdiscard() { WOPS = []; WDIFF = null; WMSG = ""; renderSettings(); }
async function wsave() {
  try { await post("/api/workflow", {ops: WOPS, hash: S.workflow_hash}); await loadSettings(); status("Saved. workflow.yaml has uncommitted changes: commit it when you're ready."); }
  catch (e) { WMSG = e.message; renderSettings(); if (e.message.includes("changed on disk")) setTimeout(loadSettings, 1500); }
}
async function rulesPreview() {
  try { RDIFF = {...await post("/api/rules/preview", {text: RULES ?? S.rules}), error: ""}; } catch (e) { RDIFF = {error: e.message}; }
  renderSettings();
}
async function rulesSave() {
  try { await post("/api/rules", {text: RULES ?? S.rules, hash: S.hash}); await loadSettings(); status("Saved. settings.md has uncommitted changes: commit it when you're ready."); }
  catch (e) { RDIFF = {error: e.message}; renderSettings(); }
}
async function packUpgrade() {
  try {
    const r = await post("/api/pack/upgrade", {});
    if (r.conflicts) { PACK = {...PACK, conflicts: r.conflicts}; REVIEW = true; return renderSettings(); }
    await loadSettings(); status(`Upgraded ${r.pack} to ${r.to}. The playbook files have uncommitted changes: commit them when you're ready.`);
  } catch (e) { WMSG = e.message; renderSettings(); }
}
function openStepSettings(sid, name, kind) {
  OPENSTEP = {sid, name, kind};
  const ctx = {kind, writes: curVal(`agent.${name}.writes`)};
  const fs = agentFields(name).filter(f => appliesTo(f, ctx));
  document.getElementById("drawer-body").innerHTML = `<h2 class="title">${esc(titleCase(name))}</h2>
    <div class="muted small">${esc(kind === "skill" ? "A skill" : "An agent")} in the ${esc((stageOf(sid) || {}).name || sid)} stage. Changes apply to every stage that uses it.</div>
    <div style="margin-top:12px">${fs.map(fieldHtml).join("") || '<div class="muted">Nothing to set.</div>'}</div>
    <div class="actions"><button class="secondary" onclick="closeDrawer()">Done</button><span class="muted small">Then use “Review changes” on the page.</span></div>`;
  wire(document.getElementById("drawer-body"));
  document.getElementById("drawer-body").querySelectorAll("[data-path$='.writes']").forEach(el => el.addEventListener("change", () => openStepSettings(sid, name, kind)));
  document.getElementById("drawer").classList.add("open");
}
const titleCase = s => (s || "").replace(/[-_]+/g, " ").replace(/^./, c => c.toUpperCase());

/* ---- Learnings ---- */
function learningsHtml() {
  const entries = list => list.length ? list.map(e => `<div class="entry" id="en-${esc(e.id)}"><code>${esc(e.id)}</code><span style="flex:1">${esc(e.roles.join(", "))} · ${esc(e.text)}</span><a class="ia" title="Edit" onclick="editLearning('${esc(e.id)}')">${EDIT_ICON}</a><a class="ia del" title="Delete" onclick="delLearning('${esc(e.id)}')">${DEL_ICON}</a></div>`).join("") : '<span class="muted">None</span>';
  return `<div class="group"><h3>Learnings</h3>${entries(S.learnings.Learnings||[])}<h3 style="margin-top:12px">Answers</h3>${entries(S.learnings.Answers||[])}</div>`;
}

const SETTING_TABS = [["global", "Global"], ["workflow", "Workflow"], ["learnings", "Learnings"]];
function renderSettings() {
  const body = {global: globalHtml, workflow: workflowHtml, learnings: learningsHtml}[curSub]();
  const dirty = new Set(Object.keys(changes).map(tabOfPath));
  document.getElementById("settings-view").innerHTML = `<div class="subtabs">${SETTING_TABS.map(([id, t]) => `<button id="st-${id}" class="${id === curSub ? "on" : ""}${dirty.has(id) ? " dirty" : ""}" onclick="subTab('${id}')">${t}</button>`).join("")}</div>
    ${body}
    <div class="actions"><button class="primary" onclick="preview()">Review changes</button><span class="muted" id="status"></span></div>
    <div id="diff"></div>`;
  wire(document.getElementById("settings-view"));
  if (curSub === "global") ppRender();
}
async function loadSettings() {
  S = await api("/api/settings"); changes = {}; WOPS = []; WDIFF = null; WMSG = ""; ADDING = null; RULES = null; RDIFF = null; REVIEW = false;
  PACK = await api("/api/pack").catch(() => null); renderSettings();
}
function subTab(id) { curSub = id; renderSettings(); history.replaceState(null, "", "#settings/" + id); }

/* ---- principles: files in .claude/principles/, a list in Global, editor in the side panel ---- */
const ppMsg = (m, bad) => { const e = document.getElementById("err-principles"); if (e) e.textContent = bad ? m : ""; if (!bad) status(m); };
async function ppReload() {
  const n = await api("/api/settings");
  S.effective.global.principle.list = n.effective.global.principle.list; S.principle_problems = n.principle_problems;
  ppRender();
}
function ppRender() {
  const el = document.getElementById("pp-list"); if (!el) return;
  const specs = S.effective.global.principle.list || {};
  const rows = Object.entries(specs).map(([n, p]) => {
    const empty = !(p.body || "").replace(/<!--[\s\S]*?-->/g, "").trim();
    const who = (p.applies_to && p.applies_to.length) ? p.applies_to.join(", ") : "all";
    return `<tr><td><b>${esc(n)}</b>${empty ? ' <span class="muted" title="No text yet: agents are not shown this file">placeholder</span>' : ""}</td>
      <td class="muted">${esc(p.summary || "")}</td><td>${esc(who)}</td><td class="muted">${esc(p.when || "")}</td>
      <td class="rv-act"><a title="Edit" onclick="ppEdit('${esc(n)}')">${EDIT_ICON}</a><a class="del" title="Delete" onclick="ppRemove('${esc(n)}')">${DEL_ICON}</a></td></tr>`;
  }).join("");
  const bad = (S.principle_problems || []).filter(p => !specs[p.name]).map(p => `<tr><td><span class="rv-err">⚠</span> <b>${esc(p.name)}</b></td>
      <td colspan="3" class="muted"><span class="rv-file">${esc(p.file)}</span> <span class="rv-errtext">${esc(p.error)}</span></td><td></td></tr>`).join("");
  const none = !rows && !bad ? `<div class="muted" style="margin-bottom:8px">No principles yet. Run /epi:init to add the starter set, or add your own.</div>` : "";
  el.innerHTML = `${none}${rows || bad ? `<table><tr><th>Name</th><th>Summary</th><th>Applies to</th><th>When</th><th></th></tr>${rows}${bad}</table>` : ""}`;
}
let PP = null;
function ppEdit(name) {
  const p = name ? S.effective.global.principle.list[name] : {};
  PP = {name};
  const row = (label, html, help) => `<div class="field" style="grid-template-columns:110px 1fr"><label>${label}</label><div>${html}${help ? `<div class="help">${help}</div>` : ""}</div></div>`;
  const roles = p.applies_to && p.applies_to.length ? p.applies_to : [];
  document.getElementById("drawer-body").innerHTML = `<h2 style="margin-top:0">${name ? "Edit principle: " + esc(name) : "Add principle"}</h2>
    ${name ? "" : row("Name", `<input id="pp-name" placeholder="e.g. api-conventions">`, "Letters, digits, - and _. Becomes .claude/principles/&lt;name&gt;.md")}
    ${row("Summary", `<input id="pp-summary" value="${esc(p.summary || "")}" placeholder="One line agents see before opening the file">`)}
    ${row("Applies to", S.schema.roles.map(r => `<label style="display:inline-block;margin-right:12px"><input type="checkbox" class="pp-role" value="${r}" ${roles.includes(r) ? "checked" : ""} style="width:auto"> ${r}</label>`).join(""), "None ticked means all agents")}
    ${row("When", `<textarea id="pp-when" rows="2" placeholder="always">${esc(p.when || "")}</textarea>`, "Optional: touches-ui, risk>=medium, paths:[globs], joined with 'or'. Judged once the spec exists")}
    ${row("Principle", `<textarea id="pp-body" rows="16" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc((p.body || "").replace(/<!--[\s\S]*?-->/g, "").trim())}</textarea>`, "What an agent should know to do this the way the repo does it. Markdown.")}
    <div class="err" id="pp-err"></div>
    <div class="actions"><button class="primary" onclick="ppSave()">Save</button> <button class="secondary" onclick="closeDrawer()">Cancel</button></div>`;

async function ppSave() {

  const name = PP.name || $("pp-name").value.trim();
  const front = {summary: $("pp-summary").value.trim(), applies_to: [...document.querySelectorAll(".pp-role:checked")].map(x => x.value),
                 when: $("pp-when").value.trim().replace(/\s*\n\s*/g, " ")};

async function ppRemove(n) {

async function preview() {
  if (document.querySelector(".err:not(:empty)")) return status("Fix the errors first");
  if (!Object.keys(changes).length) return status("No changes");
  try {
    const r = await api("/api/settings/preview", {method: "POST", body: JSON.stringify({changes})});
    const a = r.before.split("\n"), b = r.after.split("\n");
    const lines = b.map(l => a.includes(l) ? esc(l) : `<span class="add">+ ${esc(l)}</span>`)
      .concat(a.filter(l => !b.includes(l)).map(l => `<span class="del">- ${esc(l)}</span>`));
    document.getElementById("diff").innerHTML = `<h3>Changes to ${esc((r.files || []).join(", "))}</h3><div class="diff">${lines.join("\n")}</div>
      ${(r.writes || []).length ? `<p class="muted">Will also write: ${r.writes.map(w => esc(w.path) + (w.new ? " (new)" : " (changed)")).join(", ")}</p>` : ""}
      <div class="actions"><button class="primary" onclick="save()">Save</button><button class="secondary" onclick="loadSettings()">Discard</button></div>`;
  } catch (e) { status(e.message); }
}
async function save() {

  } catch (e) { status(e.message); if (e.message.includes("changed on disk")) setTimeout(loadSettings, 1500); }

  catch (e) { status(e.message); }
}

function status(t) { document.getElementById("status").textContent = t; }

/* ---------------- Tabs ---------------- */
function show(tab) {
  document.getElementById("board-view").hidden = tab !== "board";
  document.getElementById("settings-view").hidden = tab !== "settings";
  document.getElementById("help-view").hidden = tab !== "help";
  document.getElementById("tab-help").classList.toggle("on", tab === "help");
  document.getElementById("tab-board").classList.toggle("on", tab === "board");
  document.getElementById("tab-settings").classList.toggle("on", tab === "settings");
  if (tab === "settings") { history.replaceState(null, "", "#settings/" + curSub); loadSettings(); }
  if (tab === "help") loadHelp();
}
document.getElementById("tab-board").onclick = () => show("board");
document.getElementById("tab-settings").onclick = () => show("settings");
document.getElementById("tab-help").onclick = () => show("help");

function md(src) {
  const inl = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const cells = l => l.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const L = src.split("\n"), out = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`); continue; }
    let m = l.match(/^(#{1,3})\s+(.*)/);
    if (m) { out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(L[i + 1] || "")) {
      const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${inl(c)}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table>`); continue;
    }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) {
      const tag = /^\s*\d+\./.test(l) ? "ol" : "ul", items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s/.test(L[i])) items.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      out.push(`<${tag}>${items.map(x => `<li>${inl(x)}</li>`).join("")}</${tag}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(```|#|\||\s*([-*]|\d+\.)\s)/.test(L[i])) p.push(L[i++]);
    out.push(`<p>${inl(p.join(" "))}</p>`);
  }
  return out.join("\n");
}

async function loadHelp() {
  const el = document.getElementById("help-text");
  if (el.innerHTML) return;
  const r = await fetch("/api/help", {headers: {"X-Epi-Token": TOKEN}});
  el.innerHTML = md(await r.text());
}
const sm = location.hash.match(/^#settings(?:\/(\w+))?$/);
if (sm) { if (sm[1]) curSub = {stage: "workflow", agent: "workflow"}[sm[1]] || sm[1]; show("settings"); }
loadBoard().then(() => { const m = location.hash.match(/^#task-(\w+)$/); if (m) openTask(m[1]); })
  .catch(e => { document.getElementById("board").textContent = e.message; setOffline(e); });
setInterval(() => {
  if (document.hidden) return;
  if (!document.getElementById("board-view").hidden) { loadBoard().then(() => setOffline(null), setOffline); pollTask().catch(() => {}); }
}, 4000);

</script>
